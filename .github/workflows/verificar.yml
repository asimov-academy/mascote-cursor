name: Verificar projeto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verificar
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: resultados-dos-testes
          path: test-results/
          retention-days: 7
